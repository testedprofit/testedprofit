<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish path redirect | TestedProfit</title>
    <link rel="canonical" href="https://testedprofit.com/espanol/">
    <meta name="description" content="Legacy /espanol/ URLs redirect to the same TestedProfit path without the espanol prefix.">
    <meta name="robots" content="noindex, nofollow">
    <script>
        // Redirect /espanol/some/path → /some/path
        var path = window.location.pathname.replace(/^\/espanol/, '') || '/';
        window.location.replace(path);
    </script>
<meta property="og:image" content="https://testedprofit.com/assets/profitnet-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Spanish path redirect | TestedProfit">
<meta name="twitter:description" content="Legacy /espanol/ URLs redirect to the same TestedProfit path without the espanol prefix.">
<meta name="twitter:image" content="https://testedprofit.com/assets/profitnet-og.png">
</head>
<body>
    <h1>Redirecting</h1>
    <p>Redirecting... <a id="link" href="/">Click here if not redirected</a></p>
    <script>
        document.getElementById('link').href = window.location.pathname.replace(/^\/espanol/, '') || '/';
    </script>
</body>
</html>
