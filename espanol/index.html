<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish path redirect | TestedProfit</title>
    <link rel="canonical" href="https://testedprofit.com/espanol/">
    <meta name="description" content="Legacy /espanol/ URLs redirect to the same TestedProfit path without the espanol prefix.">
    <meta name="robots" content="noindex, nofollow">
    <script>
        // Redirect /espanol/some/path → /some/path
        var path = window.location.pathname.replace(/^\/espanol/, '') || '/';
        window.location.replace(path);
    </script>
<link rel="stylesheet" href="/assets/site-nav.css">
<script src="/assets/site-nav.js" defer></script>
<script>(function(){var ids={"mobile-menu-btn":1,"close-menu-btn":1,"mobile-menu":1};var real=Document.prototype.getElementById;Document.prototype.getElementById=function(id){var el=real.call(this,id);if(el||!ids[id])return el;var d=document.createElement("div");d.querySelectorAll=function(){return [];};return d;};})();</script>
</head>
<body>
    <h1>Redirecting</h1>
    <p>Redirecting... <a id="link" href="/">Click here if not redirected</a></p>
    <script>
        document.getElementById('link').href = window.location.pathname.replace(/^\/espanol/, '') || '/';
    </script>
</body>
</html>
