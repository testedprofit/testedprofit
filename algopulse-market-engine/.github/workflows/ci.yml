name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Formatter and linter checks when configured
        run: |
          if grep -q '^\[tool\.ruff\]' pyproject.toml; then
            python -m ruff check .
          else
            echo "No Ruff configuration found."
          fi
          if grep -q '^\[tool\.black\]' pyproject.toml; then
            python -m black --check .
          else
            echo "No Black configuration found."
          fi

      - name: Repo hygiene and secret guard
        run: python scripts/repo_guard.py

      - name: Dashboard JavaScript syntax
        run: node --check src/algopulse/static/app.js

      - name: Test
        run: python -m pytest -q
